name: giotag_mobile
description: GioTag - Secure Geotagged Photo Capture & Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1
  
  # Camera & Media
  camera: ^0.10.5+9
  image: ^4.1.7
  
  # Location/GPS
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  
  # Local Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # Device Info
  device_info_plus: ^10.1.0
  
  # Connectivity
  connectivity_plus: ^6.0.3
  
  # Crypto
  crypto: ^3.0.3
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
