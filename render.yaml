databases:
  - name: giotag-db
    databaseName: giotag
    user: giotaguser
    plan: free

services:
  - type: web
    name: giotag-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: giotag-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LOCAL_STORAGE_PATH
        value: /var/data/uploads
      - key: LOCAL_LEDGER_PATH
        value: /var/data/ledger_data.json
    disk:
      name: evidence-disk
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: giotag-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: giotag-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
