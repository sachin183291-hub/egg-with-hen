databases:
  - name: giotag-db
    databaseName: giotag
    user: giotaguser
    plan: free

services:
  - type: web
    name: giotag-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: giotag-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # IMPORTANT: SECRET_KEY must use sync:true (not generateValue:true) so the
      # same key is used across restarts. generateValue regenerates on every deploy,
      # invalidating all existing JWT tokens and breaking logins.
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: LOCAL_STORAGE_PATH
        value: ./uploads
      - key: LOCAL_LEDGER_PATH
        value: ./app/blockchain/ledger_data.json
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"

  - type: web
    name: giotag-frontend
    env: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: giotag-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
